server {
    listen 80;
    server_name localhost;

    # Корень для статических файлов фронтенда (собранный React)
    root /var/www/frontend;
    index index.html;

    # API запросы проксируются в Laravel (PHP-FPM)
    location /api/ {
        # Убираем префикс /api и передаём в index.php
        rewrite ^/api/(.*)$ /$1 break;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        include fastcgi_params;
    }

    # Статические файлы фронтенда (если есть папка assets)
    location /static/ {
        alias /var/www/frontend/assets/;
    }

    # Для всех остальных запросов отдаём index.html (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Запрет доступа к скрытым файлам
    location ~ /\.(?!well-known).* {
        deny all;
    }
}